<form id="registerForm">

    <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
    >
    <br>
    <input
        type="email"
        id="registerEmail"
        placeholder="Email"
        required
    >
    <br>
    <input
        type="password"
        id="registerPassword"
        placeholder="Password"
        required
    >
    <br>
    <button type="submit">Create Account</button>
    <br>
</form>

<p>
    Already have an account?
    <br>
    <a href="login.html">Login</a>
</p>
