<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <header>
            <h1>CampusConnect</h1>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="create-issue.html">Report Issue</a>
                <a href="profile.html">Profile</a>
            </nav>
        </header>

        <main>

            <h2>Campus Issues</h2>

            <div id="issuesContainer">

                <div class="issue-card">

                    <h3>Fan not working</h3>

                    <p>
                        The fan in Room is not working.
                    </p>

                    <span class="category">
                        Classroom
                    </span>

                    <span class="status open">
                        Open
                    </span>

                </div>

                <div class="issue-card">

                    <h3>Wi-Fi not working</h3>

                    <p>
                        Wi-Fi is not working in the library.
                    </p>

                    <span class="category">
                        Campus
                    </span>

                    <span class="status progress">
                        In Progress
                    </span>

                </div>

            </div>

        </main>

    </div>

</body>

</html>
